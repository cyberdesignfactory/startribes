# This file lives at the REPO ROOT (/)
version: 1
applications:
  - appRoot: apps/previewer
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
            # ☕ Install Java OpenJDK 17 (Required for the shadow-cljs compiler to execute)
            # - dnf install -y java-17-amazon-corretto-devel


            # ☕ 1. Install Java (Required for Clojure compilation)
            # - amazon-linux-extras install java-openjdk11 -y
            # 💧 2. Download and run the official Clojure installer script



            - curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
            - chmod +x linux-install.sh
            # 🛠️ 3. Install it locally without needing root privileges
            - ./linux-install.sh --prefix "$HOME/.local"
            - export PATH="$PATH:$HOME/.local/bin"


            # 🛠️ 3. Put clojure executable in the current execution path
            - export PATH="$PATH:$HOME/.local/bin"

        build:
          commands:
            - npm run release
      artifacts:
        baseDirectory: public # This is relative to your appRoot
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .shadow-cljs/**/*

